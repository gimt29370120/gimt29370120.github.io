<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<canvas id="myCanvas" width="2000" height="1600" style="width:400px;height:320px;border:1px solid #ccc;"></canvas>

<script>
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');
console.log(canvas.width);

drow(15);

function drow(g){

let a=[[canvas.width/4,canvas.height/2],[canvas.width/4*3,canvas.height/2]];
let b=[];

for(let j=0;j<g;j++){

b.push(a[0]);
for(let i=0;i<a.length-1;i++){
let dx=a[i+1][0]-a[i][0];
let dy=a[i+1][1]-a[i][1];
let mx=a[i][0]+0.5*dx;
let my=a[i][1]+0.5*dy;
let x=mx+dy*(i%2?-0.5:0.5);
let y=my+dx*(i%2?0.5:-0.5);
b.push([x,y]);
b.push(a[i+1]);
}
a=b;
b=[];

}

ctx.beginPath();
for(let i=0;i<a.length-1;i++){
const x0=a[i][0],y0=a[i][1];
const x1=a[i+1][0],y1=a[i+1][1]; 
ctx.moveTo(x0,y0);
ctx.lineTo(x1,y1);
}
ctx.strokeStyle = 'blue';
ctx.lineWidth = 2;
ctx.stroke();
}
</script>
</body>
</html>
